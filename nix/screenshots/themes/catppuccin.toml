# Catppuccin: Latte where the desktop is light, Mocha where it is dark. Six
# colours each, the rest is mixed from them.
[popup.light]
surface = "#eff1f5"
text = "#4c4f69"
accent = "#8839ef"
success = "#40a02b"
warning = "#df8e1d"
error = "#d20f39"

[popup.dark]
surface = "#1e1e2e"
text = "#cdd6f4"
accent = "#cba6f7"
success = "#a6e3a1"
warning = "#f9e2af"
error = "#f38ba8"
