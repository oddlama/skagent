[package]
name = "skagent"
description = "ssh-agent for FIDO2 (sk) keys that caches the PIN and still requires a touch per signature"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "skagent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
colored.workspace = true
futures-util.workspace = true
rustix = { workspace = true, features = ["rand"] }
serde.workspace = true
sha2.workspace = true
signature.workspace = true
skagent-fds.workspace = true
skagent-fido.workspace = true
skagent-popup.workspace = true
skagent-secret.workspace = true
ssh-agent-lib.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Signs pairing challenges in tests, like a security key would.
ed25519-dalek = "2"
# Paused time for the logind retry loop.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
