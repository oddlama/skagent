[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.91"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bech32 = "0.11"
chacha20poly1305 = "0.10"
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
hkdf = "0.12"
# ML-KEM-768 only, and only with randomness we pass in.
libcrux-ml-kem = { version = "0.0.11", default-features = false, features = [
  "mlkem768",
] }
libcrux-sha3 = "0.0.11"
libfido2-sys = "0.5"
colored = "3"
futures-util = { version = "0.3", default-features = false }
libc = "0.2"
rustix = { version = "1", features = ["fs", "mm", "param", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skagent-age = { path = "crates/skagent-age" }
skagent-fds = { path = "crates/skagent-fds" }
skagent-fido = { path = "crates/skagent-fido" }
skagent-popup = { path = "crates/skagent-popup" }
skagent-secret = { path = "crates/skagent-secret" }
sha2 = "0.10"
# AGPL-3.0, test-only: only skagent-testkey may depend on these.
soft-fido2 = { version = "0.17", default-features = false, features = ["std"] }
soft-fido2-transport = "0.17"
ssh-agent-lib = "0.6"
subtle = "2"
signature = "2.2"
tempfile = "3"
toml = { version = "1.2", default-features = false, features = [
  "parse",
  "serde",
  "std",
] }
tokio = { version = "1", features = [
  "macros",
  "io-util",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "ansi",
  "env-filter",
  "fmt",
  "tracing-log",
] }
x25519-dalek = { version = "2", default-features = false, features = [
  "zeroize",
] }
zbus = { version = "6", default-features = false, features = [
  "proxy",
  "tokio",
] }
zeroize = "1"

# Lints shared by every crate. Each crate root additionally carries
# `#![deny(clippy::unwrap_used, clippy::expect_used, clippy::panic)]`, see AGENTS.md.
[workspace.lints.rust]
missing_docs = "warn"
# deny, not forbid: the few crates that wrap raw memory or FFI allow it at
# their root. Every other crate root carries `#![forbid(unsafe_code)]`.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Everything that can terminate a production path unexpectedly.
arithmetic_side_effects = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
# println!/eprintln! panic when the stream is closed; write with writeln! and handle the error.
print_stderr = "deny"
print_stdout = "deny"
string_slice = "deny"
todo = "deny"
# Every unsafe block does one thing and says why it's sound.
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[profile.release]
# Integer overflow is a bug, not a wraparound, in release builds too.
overflow-checks = true
