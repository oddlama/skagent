[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
libfido2-sys = "0.5"
colored = "3"
futures-util = { version = "0.3", default-features = false }
rustix = { version = "1", features = ["fs", "mm", "param", "process"] }
skagent-fido = { path = "crates/skagent-fido" }
skagent-secret = { path = "crates/skagent-secret" }
sha2 = "0.10"
# AGPL-3.0, test-only: only skagent-testkey may depend on these.
soft-fido2 = { version = "0.17", default-features = false, features = ["std"] }
soft-fido2-transport = "0.17"
ssh-agent-lib = "0.6"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = [
  "macros",
  "io-util",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "ansi",
  "env-filter",
  "fmt",
  "tracing-log",
] }
zbus = { version = "6", default-features = false, features = [
  "proxy",
  "tokio",
] }
zeroize = "1"

# Lints shared by every crate. Each crate root additionally carries
# `#![deny(clippy::unwrap_used, clippy::expect_used, clippy::panic)]`, see AGENTS.md.
[workspace.lints.rust]
missing_docs = "warn"
# deny, not forbid: the few crates that wrap raw memory or FFI allow it at
# their root. Every other crate root carries `#![forbid(unsafe_code)]`.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Everything that can terminate a production path unexpectedly.
arithmetic_side_effects = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
# println!/eprintln! panic when the stream is closed; write with writeln! and handle the error.
print_stderr = "deny"
print_stdout = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[profile.release]
# Integer overflow is a bug, not a wraparound, in release builds too.
overflow-checks = true
