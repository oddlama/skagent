[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

# Lints shared by every crate. Each crate root additionally carries
# `#![deny(clippy::unwrap_used, clippy::expect_used, clippy::panic)]`, see AGENTS.md.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Everything that can terminate a production path unexpectedly.
arithmetic_side_effects = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[profile.release]
# Integer overflow is a bug, not a wraparound, in release builds too.
overflow-checks = true
