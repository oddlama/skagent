[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
colored = "3"
rustix = { version = "1", features = ["fs", "process"] }
ssh-agent-lib = "0.6"
tempfile = "3"
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "ansi",
  "env-filter",
  "fmt",
  "tracing-log",
] }

# Lints shared by every crate. Each crate root additionally carries
# `#![deny(clippy::unwrap_used, clippy::expect_used, clippy::panic)]`, see AGENTS.md.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Everything that can terminate a production path unexpectedly.
arithmetic_side_effects = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
# println!/eprintln! panic when the stream is closed; write with writeln! and handle the error.
print_stderr = "deny"
print_stdout = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[profile.release]
# Integer overflow is a bug, not a wraparound, in release builds too.
overflow-checks = true
